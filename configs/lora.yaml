# Configuration for DeepSeek-OCR-2 LoRA fine-tuning.

model:
  name: unsloth/DeepSeek-OCR-2
  local_dir: deepseek_ocr2
  load_in_4bit: false
  trust_remote_code: true
  unsloth_force_compile: true
  use_gradient_checkpointing: unsloth
  output_path: ../models/deepseek_ocr2_lora_adapter

lora:
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  r: 16
  lora_alpha: 16
  lora_dropout: 0
  bias: none
  random_state: 3407
  use_rslora: false
  loftq_config: null

data:
  dataset_name: CADT-IDRI/khmer-sala-ocr-16k
  subset: default
  splits:
    - train
    - validation
  test_split: test
  instruction: "<image>\nFree OCR."
  image_size: 768
  base_size: 1024
  crop_mode: true
  train_on_responses_only: true

inference:
  baseline_model: unsloth/DeepSeek-OCR-2
  adapter_path: ../models/deepseek_ocr2_lora_adapter
  prompt: "<image>\nFree OCR."
  output_dir: output
  image_size: 768
  base_size: 1024
  crop_mode: true

training:
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 6
  warmup_steps: 5
  eval_strategy: steps
  eval_steps: 1000
  save_steps: 1000
  num_train_epochs: 2
  learning_rate: 2.0e-4
  logging_steps: 10
  optim: adamw_8bit
  weight_decay: 0.001
  lr_scheduler_type: linear
  seed: 3407
  output_dir: outputs
  report_to: none
  dataloader_num_workers: 2
  remove_unused_columns: false
  metric_for_best_model: eval_loss
  load_best_model_at_end: true
  fp16: auto
  bf16: auto

early_stopping:
  patience: 3
  threshold: 0.001
