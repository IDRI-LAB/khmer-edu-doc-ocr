# Configuration for KhmerEduDoc OCR fine-tuning and inference.
# All relative paths are resolved against src/.

deepseek:
  model:
    name: unsloth/DeepSeek-OCR-2
    local_dir: deepseek_ocr2
    load_in_4bit: false
    max_seq_length: 4096
    trust_remote_code: true
    unsloth_force_compile: true
    use_gradient_checkpointing: unsloth
    output_path: models/deepseek_ocr2_khmer_lora

  lora:
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    r: 16  # Paper: r = alpha = 16
    lora_alpha: 16
    lora_dropout: 0
    bias: none
    random_state: 3407
    use_rslora: false
    loftq_config: null

  data:
    dataset_name: CADT-IDRI/KhmerEduDoc
    subset: default
    train_split: train
    validation_split: validation
    test_split: test_setB
    instruction: "<image>\nFree OCR."
    image_size: 768  # Paper: 768 minimum resolution
    base_size: 1024  # Paper: 1024 base resolution
    crop_mode: true
    train_on_responses_only: true

  inference:
    baseline_model: unsloth/DeepSeek-OCR-2
    adapter_path: models/deepseek_ocr2_khmer_lora
    prompt: "<image>\nFree OCR."
    output_dir: output/deepseek
    image_size: 768
    base_size: 1024
    crop_mode: true

  training:
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 2
    gradient_accumulation_steps: 5
    eval_accumulation_steps: 1
    max_grad_norm: 1.0
    warmup_steps: 5
    eval_strategy: steps
    eval_steps: 1000
    save_steps: 1000
    # 61,750 training pages x 2 epochs / effective batch 10 = 12,350 steps
    num_train_epochs: 2
    learning_rate: 1.0e-4  # Paper: 1e-4
    logging_steps: 10
    optim: adamw_8bit
    weight_decay: 0.001
    lr_scheduler_type: linear
    seed: 3407
    output_dir: outputs/deepseek
    report_to: none
    dataloader_num_workers: 2
    remove_unused_columns: false
    metric_for_best_model: eval_loss
    load_best_model_at_end: true
    fp16: false
    bf16: true

  early_stopping:
    patience: 3
    threshold: 0.001

paddle:
  model:
    name: unsloth/PaddleOCR-VL
    max_seq_length: 4096
    load_in_4bit: false
    load_in_8bit: false
    full_finetuning: false
    trust_remote_code: true
    unsloth_force_compile: true
    output_path: models/paddleocr_vl_khmer_lora

  lora:
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
      - out_proj
      - fc1
      - fc2
      - linear_1
      - linear_2
    r: 64  # Paper: r = alpha = 64
    lora_alpha: 64
    lora_dropout: 0
    bias: none
    random_state: 3407
    use_rslora: false

  data:
    dataset_name: CADT-IDRI/KhmerEduDoc
    subset: default
    train_split: train
    validation_split: validation
    test_split: test_setB
    instruction: "OCR:"
    # PaddleOCR-VL uses the processor's dynamic image resolution.

  inference:
    baseline_model: unsloth/PaddleOCR-VL
    adapter_path: models/paddleocr_vl_khmer_lora
    prompt: "OCR:"
    output_dir: output/paddle
    max_new_tokens: 4096

  collator:
    ignore_index: -100
    max_seq_length: 4096
    train_on_responses_only: true
    instruction_part: "User:"
    response_part: "\nAssistant:"
    pad_to_multiple_of: 8

  training:
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 2
    gradient_accumulation_steps: 5
    eval_accumulation_steps: 1
    max_grad_norm: 1.0
    warmup_steps: 5
    eval_strategy: steps
    eval_steps: 1000
    save_steps: 1000
    # 61,750 training pages x 2 epochs / effective batch 10 = 12,350 steps
    num_train_epochs: 2
    learning_rate: 5.0e-5  # Paper: 5e-5
    logging_steps: 10
    optim: adamw_8bit
    weight_decay: 0.001
    lr_scheduler_type: linear
    seed: 3407
    output_dir: outputs/paddle/checkpoints
    report_to: none
    dataloader_num_workers: 2
    remove_unused_columns: false
    dataset_text_field: ""
    dataset_kwargs:
      skip_prepare_dataset: true
    max_length: 4096
    fp16: false
    bf16: true
    metric_for_best_model: eval_loss
    load_best_model_at_end: true

  early_stopping:
    patience: 3
    threshold: 0.001
